name: Daily AI Agent Content Generator
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install ddgs duckduckgo-search langchain-groq langchain-community langgraph google-genai requests Pillow

      - name: Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          git add _posts/*.md
          git add assets/img/*.png
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "AI Update: $(date +'%Y-%m-%d')"
            git push origin main
          fi
