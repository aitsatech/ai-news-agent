name: Daily AI Agent Content Generator
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      pages: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Sovereign Intelligence Syndicate
        id: run_agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Flip to "true" only once GEMINI_API_KEY is confirmed billing-enabled --
          # imagen-3.0-generate-001 fails on free-tier keys and just wastes a call.
          ENABLE_GEMINI_IMAGEN: "false"
        run: python agent.py
      - name: Automated QA Sweep
        # Non-interactive junk/duplicate post cleanup -- previously a manual
        # step, now runs every day so the desk stays autonomous end to end.
        run: |
          chmod +x cleanup_old_posts.sh
          ./cleanup_old_posts.sh --yes
      - name: Prune Orphaned Images
        # Only removes images no post references any more -- age-based post
        # pruning is disabled, the archive is kept indefinitely.
        run: python cleanup.py
      - name: Commit and Push
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          mkdir -p _posts assets/img

          # -A (not just *.md / the bare directory) so that deletions made by
          # the QA sweep and cleanup.py -- junk posts, old drafts, orphaned
          # images -- are staged too, not just new/modified files.
          git add -A _posts/
          git add -A assets/img/

          if git diff --cached --quiet; then
            echo "No new content generated today."
          else
            git commit -m "�� AI Content Update: $(date +'%Y-%m-%d') [skip ci]"
            # Added pull to prevent "rejected" errors if the repo changed
            git pull --rebase origin main
            git push origin main
          fi
      - name: Trigger Website Deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml --ref main || echo "Deployment workflow not found, skipping..."
      - name: Notify on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "�� Apex Agent Failure: $(date +'%Y-%m-%d')" \
            --body "The Sovereign Intelligence Syndicate failed to deploy. Check logs: https://github.com/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID" \
            --assignee "${{ github.actor }}"
