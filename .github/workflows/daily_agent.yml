name: Daily AI Agent Content Generator

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # The DevOps Magus safety valve
    permissions:
      contents: write
      actions: write
      pages: write
      issues: write  # Critical: Allows The Sentinel to report failures
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U duckduckgo-search ddgs
          # Installing the Syndicate's toolset
          pip install langchain langchain-groq langchain-community langgraph requests

      - name: Run Sovereign Intelligence Syndicate
        id: run_agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Kept for future scaling
        run: python agent.py

      - name: Commit and Push
        if: success() # Only commit if the Syndicate approves the output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add _posts/*.md
          git add assets/img/*.png
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Apex Daily Update: $(date +'%Y-%m-%d')"
            git push origin main
          fi

      - name: Trigger Website Deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml --ref main

      # --- THE SENTINEL PROTOCOL ---
      - name: Notify on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Apex Agent Failure: $(date +'%Y-%m-%d')" \
            --body "The Sovereign Intelligence Syndicate failed to deploy. Check the Actions logs immediately. \n\nRun ID: $GITHUB_RUN_ID" \
            --assignee "${{ github.actor }}"
