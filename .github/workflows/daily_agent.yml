name: Daily AI Agent Content Generator

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U duckduckgo-search  # Explicitly upgrade this first
          pip install langchain langchain-groq langchain-community langgraph google-genai requests Pillow

      - name: Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: System Cleanup and Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure directories exist
          mkdir -p _posts assets/img
          
          # Stage changes
          git add _posts/*.md
          git add assets/img/*.png
          
          # Commit and Push logic
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Content Update: $(date +'%Y-%m-%d')"
            # Pull with rebase to handle any sync issues during the run
            git pull --rebase origin main
            git push origin main
          fi

  # Trigger the deployment workflow explicitly if the generation succeeds
  trigger-deploy:
    needs: generate-content
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml
