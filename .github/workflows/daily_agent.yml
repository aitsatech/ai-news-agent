name: Daily AI Agent Blog
on:
  schedule:
    - cron: '15 5 * * *' # Runs daily at 5:15 AM UTC
  workflow_dispatch:   # Allows you to trigger it manually for testing

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare and Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "📦 Installing necessary libraries..."
          python -m pip install --upgrade pip
          
          # Added 'ddgs' explicitly to satisfy the LangChain ImportError
          pip install ddgs duckduckgo-search langchain-groq langchain-community langgraph google-genai requests Pillow
          
          echo "🧹 Cleaning old posts..."
          if [ -f cleanup.py ]; then python cleanup.py; fi

          echo "🚀 Starting Agent (Updating Branding & Content)..."
          python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          
          # Stage the new article AND the updated assets/img/avatar.png
          git add _posts/ assets/img/
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Update: New article & branding refresh $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' 
          bundler-cache: true 

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
