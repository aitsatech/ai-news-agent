name: Daily AI Agent Blog
on:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM
  workflow_dispatch:   # Allows you to run it manually

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install langchain langchain-community langchain-groq langgraph duckduckgo-search ddgs pydantic requests

      - name: Run Agent Task Force
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python agent.py

      - name: Commit Article
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          git add .
          git commit -m "New Article: $(date)" || echo "No changes to commit"
          git push

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' 
          bundler-cache: true 

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      # --- REWRITTEN TEST STEP ---
      - name: Test Site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^.*\/categories\/.*$/,/^.*\/tags\/.*$/" \
            --allow-hash-href \
            --ignore-empty-alt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
