name: Daily AI Agent Blog
on:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM
  workflow_dispatch:   # Allows you to run it manually

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added google-genai and curl_cffi to fix the crash
          pip install langchain langchain-community langchain-groq langgraph ddgs pydantic requests google-genai curl_cffi

      - name: Run Cleanup and Agent Task Force
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Clean old posts first to keep the repo lean
          if [ -f cleanup.py ]; then python cleanup.py; else echo "No cleanup script found, skipping."; fi
          # Generate the new article
          python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Update: New article & archive cleanup $(date)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' 
          bundler-cache: true 

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
