name: Daily AI Agent Content Generator

on:
  schedule:
    # Runs at 05:15 UTC every day
    - cron: '15 5 * * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up subsequent runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicitly install duckduckgo-search first to satisfy the 'ddgs' requirement
          pip install -U duckduckgo-search
          pip install langchain langchain-groq langchain-community langgraph google-genai requests Pillow

      - name: Run AI News Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push New Post
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add _posts/ assets/img/
            git commit -m "🤖 AI Daily Update: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new content generated today."
          fi

      - name: Trigger Website Deployment
        # This tells your 'pages-deploy.yml' to run immediately after the post is saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml --ref main
