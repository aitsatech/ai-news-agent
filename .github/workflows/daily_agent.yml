name: Daily AI Agent Content Generator
on:
  schedule:
    - cron: '15 5 * * *' # 5:15 AM UTC
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ddgs duckduckgo-search langchain-groq langchain-community langgraph google-genai requests Pillow

      - name: Run Cleanup and Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Only run cleanup if the file exists
          if [ -f cleanup.py ]; then python cleanup.py; fi
          python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          
          # Stage posts and images
          git add _posts/ assets/img/
          
          if git diff --staged --quiet; then
            echo "No new content generated."
          else
            git commit -m "AI Update: New article & header image $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi
