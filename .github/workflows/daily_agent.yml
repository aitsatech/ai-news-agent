name: Daily AI Agent Blog
on:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM
  workflow_dispatch:   # Allows you to run it manually

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install langchain langchain-community langchain-groq langgraph duckduckgo-search ddgs pydantic requests

      - name: Run Cleanup and Agent Task Force
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Clean old posts first to keep the repo lean
          python cleanup.py
          # Generate the new article
          python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          git add .
          # This handles both the deleted old posts and the new post
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Update: New article & archive cleanup $(date)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' 
          bundler-cache: true 

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Test Site
        continue-on-error: true
        run: |
          # Create dummy folders to satisfy the checker for subpaths
          mkdir -p "_site${{ steps.pages.outputs.base_path }}/categories/ai"
          mkdir -p "_site${{ steps.pages.outputs.base_path }}/categories/news"
          
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/\/categories\/.*/,/\/tags\/.*/" \
            --swap-urls "{ \"^${{ steps.pages.outputs.base_path }}\" : \"\" }" \
            --allow-hash-href \
            --ignore-empty-alt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
