name: Daily AI Agent Content Generator

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # Critical for triggering pages-deploy.yml
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U duckduckgo-search ddgs
          pip install langchain langchain-groq langchain-community langgraph google-genai requests Pillow

      - name: Run AI News Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage posts and images
          git add _posts/*.md
          git add assets/img/*.png
          
          # Only commit if there are changes to avoid empty-commit errors
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Daily Post & Asset Update: $(date +'%Y-%m-%d')"
            git push origin main
          fi

      - name: Trigger Website Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml --ref main
