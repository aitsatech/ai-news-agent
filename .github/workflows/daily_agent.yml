name: Daily AI Agent Content Generator
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disabling persist-credentials helps avoid trigger loops 
          # but ensures the push is recognized as a new event
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install ddgs duckduckgo-search langchain-groq langchain-community langgraph google-genai requests Pillow

      - name: Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure assets directories exist so git add doesn't fail
          mkdir -p _posts assets/img
          
          git add _posts/*.md
          git add assets/img/*.png
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Update: $(date +'%Y-%m-%d') [skip ci]"
            # Using --force or pulling first prevents push failures
            git pull --rebase origin main
            git push origin main
          fi

      # NEW STEP: Explicitly trigger the Deployment workflow
      - name: Trigger Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Site to Pages"
