name: Daily AI Agent Blog
on:
  schedule:
    - cron: '15 5 * * *' # Runs daily at 5:15 AM
  workflow_dispatch:   # Allows manual runs

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare and Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Install dependencies first so scripts can run
          echo "📦 Installing libraries..."
          python -m pip install --upgrade pip
          pip install ddgs langchain-groq langchain-community langgraph google-genai requests curl_cffi
          
          # 2. Run Cleanup (Using your cleanup.py script)
          echo "🧹 Cleaning old posts..."
          python cleanup.py
          echo "✨ Cleanup complete."

          # 3. Verify installation for logs
          pip list | grep google

          # 4. Run the actual agent
          echo "🚀 Starting Agent..."
          python agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Editor"
          git config --global user.email "editor@ai-news.bot"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Update: New article & archive cleanup $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' 
          bundler-cache: true 

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
