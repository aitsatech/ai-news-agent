name: Daily News Publisher

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare and Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Clean old posts
          echo "🧹 Cleaning old posts..."
          find _posts/ -name "*.md" -mtime +30 -delete
          echo "✨ Cleanup complete."

          # 2. Install dependencies (The Critical Part)
          echo "📦 Installing libraries..."
          python -m pip install --upgrade pip
          pip install ddgs langchain-groq langchain-community langgraph google-genai requests curl_cffi
          
          # 3. Verify installation (For your logs)
          pip list | grep google

          # 4. Run the actual agent
          echo "🚀 Starting Agent..."
          python agent.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "New article: $(date +'%Y-%m-%d')" || exit 0
          git push
