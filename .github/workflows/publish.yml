name: Daily News Publisher

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies and Clean
        run: |
          python -m pip install --upgrade pip
          pip install ddgs langchain-groq langchain-community langgraph google-genai requests curl_cffi
          # Your cleanup command here (if it's a separate script, run it now)
          echo "✨ Environment Ready"

      - name: Run News Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "New article: $(date +'%Y-%m-%d')" || exit 0
          git push
