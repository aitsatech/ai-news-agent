# The Site Configuration
title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: >-
  A state-of-the-art newsroom powered by an autonomous agent task force, 
  producing SEO and AIO optimized deep-dives into 2026 technology.

# FIX: URL and Baseurl
# If your repo is github.com/username/ai-news-agent, these MUST match:
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# FIX: Chirpy on GitHub Pages works best with remote_theme
remote_theme: cotes2020/jekyll-theme-chirpy

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

lang: en
timezone: Africa/Johannesburg # Updated for your current location
theme_mode: dark

# GitHub Metadata
github:
  username: your_github_username

social:
  name: AI Editorial Bot
  email: example@domain.com
  links:
    - https://github.com/aitsatech

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # FIX: Added :categories to permalink to help match the expected structure
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
