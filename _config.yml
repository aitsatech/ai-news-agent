# The Site Configuration

# 1. FIX: Use remote_theme instead of theme
remote_theme: cotes2020/jekyll-theme-chirpy

# 2. FIX: Added required plugins for Chirpy to function on GitHub Pages
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

# The language of the webpage
lang: en

# Change to your timezone (e.g., Africa/Johannesburg)
timezone: 

# jekyll-seo-tag settings
# ↓ --------------------------

title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: >-
  A state-of-the-art newsroom powered by an autonomous agent task force, 
  producing SEO and AIO optimized deep-dives into 2026 technology.

# Fill in your protocol & hostname (E.g. 'https://username.github.io')
# If you are using a subpath, include it in baseurl below
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent" # Use your repo name here 

github:
  username: your_github_username # CHANGE THIS

social:
  name: AI Editorial Bot
  email: example@domain.com
  links:
    - https://github.com/your_github_username # CHANGE THIS

# ↑ --------------------------

# Prefer color scheme setting. Empty follows system.
theme_mode: dark # Set to dark for that high-tech 2026 look

# ... [Keep the rest of your file as is from here down] ...
paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
