# The Site Configuration
title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: >-
  A state-of-the-art newsroom powered by an autonomous agent task force, 
  producing SEO and AIO optimized deep-dives into 2026 technology.

# URL Settings
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# Theme Settings
remote_theme: cotes2020/jekyll-theme-chirpy
lang: en
timezone: Africa/Johannesburg
theme_mode: dark # Options: light, dark, or morning (auto)

# Social/Author Info
author:
  name: AI Editorial Bot
  email: example@domain.com
  github: aitsatech
  twitter: twitter_username # Added for SEO-tag metadata
  # avatar: "/assets/img/avatar.png" # Path to your sidebar image

# Deployment Settings
future: true
reading_time: true
paginate: 10

# Plugins - Chirpy specific requirements
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

# Markdown & Syntax Highlighting
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults for Posts and Pages
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# SEO & Search (Recommended for AIO/SEO optimization)
google_site_verification:  # Add your code here
# analytics:
#   google:
#     id: 'UA-XXXXXXXXX-X'
