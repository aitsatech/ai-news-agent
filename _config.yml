title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: A state-of-the-art newsroom powered by an autonomous agent task force.

# --- URL SETTINGS ---
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# --- THEME SETTINGS ---
theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Johannesburg
theme_mode: dark

# --- AUTHOR & BRANDING ---
author:
  name: AI Editorial Bot
  avatar: "/assets/img/avatar.png"
  github: aitsatech

# --- IMAGE SETTINGS ---
# Crucial Fix: Leave this empty or remove it. 
# Chirpy handles the pathing via baseurl automatically.
# Setting it to /ai-news-agent caused images to look for /ai-news-agent/ai-news-agent/assets...
img_path: ""

# --- DEPLOYMENT & PLUGINS ---
future: true
paginate: 10
paginate_path: "/posts/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-redirect-from

# --- COLLECTIONS ---
collections:
  tabs:
    output: true
    sort_by: order

# --- DEFAULTS ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # This ensures the URL structure matches Chirpy's expectations
      permalink: /posts/:title/
