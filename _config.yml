title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: A state-of-the-art newsroom powered by an autonomous agent task force.

# --- URL SETTINGS ---
# No trailing slash on url. Baseurl must start with a slash.
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# --- THEME SETTINGS ---
theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Johannesburg
theme_mode: dark

# --- AUTHOR & BRANDING ---
author:
  name: Aitsa
  avatar: "/assets/img/avatar.png"
  github: aitsatech

# --- IMAGE SETTINGS ---
# Keep img_path empty to allow the absolute URL logic to work correctly 
# across different sub-path deployments.
img_path: ""

# --- DEPLOYMENT & PLUGINS ---
# 'future: true' is essential so posts scheduled for '09:00:00' actually show up
future: true
paginate: 10
paginate_path: "/page:num"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-redirect-from

# --- COLLECTIONS ---
collections:
  tabs:
    output: true
    sort_by: date

# --- DEFAULTS ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Aitsa # Update this to your preferred author name
      comments: false
      toc: true
      # Consistent permalink structure for SEO
      permalink: /posts/:title/

# --- ARCHIVES ---
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/
