# The Site Configuration
title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: >-
  A state-of-the-art newsroom powered by an autonomous agent task force, 
  producing SEO and AIO optimized deep-dives into 2026 technology.

# URL Settings
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# Theme Settings
theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Johannesburg
theme_mode: dark # Options: light, dark

# Social/Author Info
author:
  name: AI Editorial Bot
  twitter: twitter_username # Just the username
  github: aitsatech
  email: example@domain.com

# This block is required for Chirpy's UI
social:
  name: AI Editorial Bot
  email: example@domain.com
  links:
    - https://twitter.com/twitter_username
    - https://github.com/aitsatech

# Deployment Settings
future: true
reading_time: true
paginate: 10

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-redirect-from
  - jekyll-twitter-plugin

# Chirpy Archive Settings
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Markdown & Syntax Highlighting
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults for Posts and Pages
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# SEO & Search
google_site_verification: 
# Chirpy Search settings
search:
  hints: true # Set to true to show search hints
