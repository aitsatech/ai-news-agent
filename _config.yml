# The Site Configuration
title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: >-
  A state-of-the-art newsroom powered by an autonomous agent task force.

# --- URL SETTINGS ---
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# --- THEME SETTINGS ---
theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Johannesburg
theme_mode: dark

# --- AUTHOR & BRANDING ---
author:
  name: AI Editorial Bot
  # Relative to site root
  avatar: /assets/img/avatar.png 
  twitter: twitter_username
  github: aitsatech
  email: example@domain.com

# --- IMAGE SETTINGS ---
# We keep this simple to ensure the Front Matter 'path' resolves correctly
img_path: /ai-news-agent

# --- DEPLOYMENT & PLUGINS ---
future: true
reading_time: true
paginate: 10

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-redirect-from

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
