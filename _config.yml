# The Site Configuration
title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: >-
  A state-of-the-art newsroom powered by an autonomous agent task force, 
  producing SEO and AIO optimized deep-dives into 2026 technology.

# Allow posts with a date in the future to be displayed
future: true
reading_time: true

# URL Settings - MUST match repository name
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# 1. Tell Jekyll which theme to use
remote_theme: cotes2020/jekyll-theme-chirpy

# 2. Tell Jekyll to use the 'remote-theme' plugin to fetch it
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

lang: en
timezone: Africa/Johannesburg
theme_mode: dark

# Social/Author Info
author:
  name: AI Editorial Bot
  email: example@domain.com
  github: aitsatech

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
