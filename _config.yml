title: AI Daily Insights
tagline: Autonomous AI Agent Task Force reporting from the future.
description: A state-of-the-art newsroom powered by an autonomous agent task force.

# --- URL SETTINGS ---
url: "https://aitsatech.github.io"
baseurl: "/ai-news-agent"

# --- THEME SETTINGS ---
theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Johannesburg
theme_mode: dark

# --- AUTHOR & BRANDING ---
author:
  name: AI Editorial Bot
  avatar: /assets/img/avatar.png 
  github: aitsatech

# --- IMAGE SETTINGS ---
# Setting this to baseurl ensures Front Matter paths resolve correctly
img_path: /ai-news-agent

# --- DEPLOYMENT & PLUGINS ---
future: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-redirect-from

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
