#  The contact options displayed at the bottom of the sidebar.
#  Powered by Font Awesome <https://fontawesome.com/>

- type: github
  icon: "fab fa-github"
  url: "https://github.com/your-username"  # Replace with your link

- type: twitter
  icon: "fa-brands fa-x-twitter"           # Updated for modern X branding
  url: "https://x.com/your-username"

- type: email
  icon: "fas fa-envelope"
  url: "mailto:yourname@email.com"
  noblank: true                            # Opens mail app in current tab

- type: rss
  icon: "fas fa-rss"
  url: "/feed.xml"                         # Standard path for Chirpy RSS
  noblank: true

# --- Optional / Popular Additions ---

- type: mastodon
  icon: "fab fa-mastodon"
  url: ""                                  # Fill and uncomment if needed

- type: linkedin
  icon: "fab fa-linkedin"
  url: ""

- type: bluesky
  icon: "fa-brands fa-bluesky"             # Requires FontAwesome 6+
  url: ""
